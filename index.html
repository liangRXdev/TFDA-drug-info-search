<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<!-- CSP：inline handler 已全數移除、JS 抽出為 app.js，故 script-src 可用 'self'。
     style-src 保留 'unsafe-inline'——內嵌 <style> 與大量 style="" 屬性尚未清理，
     且樣式注入的風險遠低於腳本執行。
     frame-ancestors 刻意省略：以 <meta> 遞送時瀏覽器會忽略該指令並在 console 報警告，
     需改由 HTTP header 設定，但 GitHub Pages 無法自訂 header。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藥品資訊查詢系統 - 食藥署資料整合</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="藥品查詢">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 藍色藥丸 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='35' width='80' height='30' rx='15' fill='%234A90D9'/><rect x='10' y='35' width='40' height='30' rx='15' fill='%23FFFFFF' opacity='0.4'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
    --primary-blue:#2563eb; --secondary-blue:#3b82f6;
    --light-blue:#dbeafe;   --lighter-blue:#eff6ff;
    --dark-blue:#1e40af;    --bg-cream:#fefce8;
    --bg-white:#ffffff;
    --text-primary:#1e293b; --text-secondary:#64748b;
    --border-color:#e2e8f0;
    --shadow-sm:0 1px 3px rgba(0,0,0,.05);
    --shadow-md:0 4px 6px -1px rgba(0,0,0,.1);
    --shadow-lg:0 10px 25px -3px rgba(37,99,235,.1);
    --amber-bg:#fffbeb;     --amber-border:#f59e0b;
    --amber-text:#92400e;
    --green-bg:#dcfce7;     --green-border:#16a34a;
    --green-text:#14532d;
    --teal-bg:#f0fdfa;      --teal-border:#0d9488;
    --teal-text:#134e4a;
    --gray-bg:#f1f5f9;      --gray-border:#94a3b8;
}

body {
    font-family:'Noto Sans TC',-apple-system,sans-serif;
    background:linear-gradient(135deg,var(--lighter-blue) 0%,var(--bg-white) 50%,var(--bg-cream) 100%);
    min-height:100vh; color:var(--text-primary); line-height:1.6;
}

/* Header */
header {
    background:var(--bg-white); border-bottom:2px solid var(--primary-blue);
    box-shadow:var(--shadow-md);
}
.header-content {
    max-width:1200px; margin:0 auto; padding:1.25rem 1.5rem;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:.5rem;
}
h1 { font-size:1.75rem; font-weight:700; color:var(--primary-blue); letter-spacing:-.025em; }
.header-subtitle { font-size:.875rem; color:var(--text-secondary); }
.data-badge {
    background:var(--lighter-blue); color:var(--primary-blue);
    border:1px solid var(--light-blue); border-radius:20px;
    padding:.25rem .875rem; font-size:.8rem; font-weight:600;
}

.container { max-width:1200px; margin:0 auto; padding:2rem 1.5rem; }

/* Search */
.search-section {
    background:var(--bg-white); border-radius:16px;
    padding:1.75rem 2rem; box-shadow:var(--shadow-lg);
    margin-bottom:1.5rem; border:1px solid var(--border-color);
}
.search-box { display:flex; gap:.75rem; margin-bottom:.875rem; }
.search-input-wrap { flex:1; position:relative; }
#searchInput {
    width:100%; padding:.875rem 1.25rem; font-size:1rem;
    border:2px solid var(--border-color); border-radius:12px;
    font-family:inherit; transition:all .3s ease;
}
#searchInput:focus {
    outline:none; border-color:var(--primary-blue);
    box-shadow:0 0 0 3px var(--light-blue);
}
#searchBtn {
    padding:.875rem 2rem; background:var(--primary-blue); color:white;
    border:none; border-radius:12px; font-size:1rem; font-weight:600;
    cursor:pointer; transition:all .3s ease; font-family:inherit;
    white-space:nowrap;
}
#searchBtn:hover:not(:disabled) {
    background:var(--dark-blue); transform:translateY(-1px); box-shadow:var(--shadow-md);
}
#searchBtn:disabled { background:var(--text-secondary); cursor:not-allowed; }

/* Filter Toggle */
.filter-row {
    display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
    margin:.5rem 0 .25rem;
}
.filter-label {
    font-size:.825rem; color:var(--text-secondary); margin-right:.25rem;
}
.filter-btn {
    padding:.4rem .875rem; border:1.5px solid var(--border-color);
    background:white; border-radius:20px; font-size:.825rem;
    cursor:pointer; font-family:inherit; transition:all .2s ease;
    color:var(--text-secondary);
}
.filter-btn:hover { border-color:var(--primary-blue); color:var(--primary-blue); }
.filter-btn.active {
    background:var(--primary-blue); color:white; border-color:var(--primary-blue);
}
.search-hint { font-size:.825rem; color:var(--text-secondary); margin-top:.5rem; }

/* Autosuggest */
.suggest-box {
    display:none; position:absolute; z-index:50;
    top:calc(100% + .375rem); left:0; right:0;
    background:var(--bg-white); border:1px solid var(--border-color);
    border-radius:12px; box-shadow:var(--shadow-lg);
    max-height:22rem; overflow-y:auto; padding:.375rem;
}
.suggest-box.active { display:block; }
.suggest-group {
    font-size:.72rem; font-weight:700; letter-spacing:.05em;
    color:var(--text-secondary); text-transform:uppercase;
    padding:.5rem .75rem .25rem;
}
.suggest-item {
    display:flex; align-items:center; justify-content:space-between; gap:.75rem;
    padding:.5rem .75rem; border-radius:8px; cursor:pointer;
    font-size:.9rem; line-height:1.4;
}
.suggest-item:hover, .suggest-item.active { background:var(--lighter-blue); }
.suggest-item .s-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.suggest-item .s-count {
    flex-shrink:0; font-size:.72rem; color:var(--text-secondary);
    background:var(--gray-bg); border-radius:10px; padding:.1rem .5rem;
}

/* Init Banner */
.init-banner {
    background:var(--lighter-blue); border:1px solid var(--light-blue);
    border-radius:10px; padding:.875rem 1.125rem; margin-top:.875rem;
    display:flex; align-items:center; gap:.75rem;
    font-size:.9rem; color:var(--primary-blue);
}
.mini-spinner {
    border:2px solid var(--light-blue); border-top:2px solid var(--primary-blue);
    border-radius:50%; width:16px; height:16px;
    animation:spin .8s linear infinite;
}

/* Loading */
.loading { display:none; text-align:center; padding:2.5rem; color:var(--primary-blue); }
.loading.active { display:block; }
.spinner {
    border:3px solid var(--light-blue); border-top:3px solid var(--primary-blue);
    border-radius:50%; width:40px; height:40px;
    animation:spin .8s linear infinite; margin:0 auto .875rem;
}

/* Results */
.results-section { display:none; }
.results-section.active { display:block; animation:fadeIn .4s ease-out; }
.results-meta { font-size:.875rem; color:var(--text-secondary); margin-bottom:1rem; }
.no-results {
    background:var(--bg-white); border-radius:12px; padding:3rem;
    text-align:center; box-shadow:var(--shadow-md); border:1px solid var(--border-color);
}

/* Drug Card */
.drug-card {
    background:var(--bg-white); border-radius:16px;
    padding:1.75rem 2rem; margin-bottom:1.25rem;
    box-shadow:var(--shadow-lg); border:1px solid var(--border-color);
    transition:box-shadow .2s ease;
}
.drug-card:hover { box-shadow:0 14px 30px -5px rgba(37,99,235,.15); }
.drug-card.is-nhi { border-left:4px solid var(--green-border); }
.drug-card.is-raw { opacity:.85; border-left:4px solid var(--gray-border); }

.drug-header {
    padding-bottom:.75rem;
    cursor:pointer; user-select:none;
}
.drug-card.expanded .drug-header {
    border-bottom:2px solid var(--lighter-blue);
    padding-bottom:1rem; margin-bottom:1.25rem;
}
.drug-header:hover .drug-name-ch { color:var(--dark-blue); }

.drug-body { display:none; }
.drug-card.expanded .drug-body { display:block; animation:fadeIn .25s ease-out; }

.drug-chevron {
    font-size:.8rem; color:var(--text-secondary);
    transition:transform .25s ease; flex-shrink:0;
    margin-left:.25rem; margin-top:.1rem;
}
.drug-card.expanded .drug-chevron { transform:rotate(180deg); }

.drug-name-row { display:flex; align-items:flex-start; gap:.75rem; flex-wrap:wrap; }
.drug-name-ch { font-size:1.4rem; font-weight:700; color:var(--primary-blue); }
.drug-name-en { font-size:1rem; color:var(--text-secondary); font-style:italic; margin:.2rem 0 .5rem; }

/* Badges */
.badge {
    display:inline-flex; align-items:center; gap:.3rem;
    padding:.2rem .65rem; border-radius:14px; font-size:.75rem;
    font-weight:600; white-space:nowrap;
}
.badge-nhi { background:var(--green-bg); color:var(--green-text); border:1px solid var(--green-border); }
.badge-raw { background:var(--gray-bg); color:var(--text-secondary); border:1px solid var(--gray-border); }
.badge-license {
    background:var(--lighter-blue); color:var(--primary-blue);
    padding:.3rem .875rem; border-radius:8px; font-size:.825rem;
    font-weight:600; display:inline-block;
}

/* Info */
.info-section { margin-bottom:1.25rem; }
.info-label {
    font-weight:600; color:var(--primary-blue); margin-bottom:.5rem;
    font-size:.9rem; display:flex; align-items:center; gap:.5rem;
}
.info-label::before {
    content:''; display:inline-block; width:4px; height:15px;
    background:var(--primary-blue); border-radius:2px; flex-shrink:0;
}
.info-content { color:var(--text-primary); font-size:.9rem; line-height:1.75; padding-left:.875rem; }

.ingredients-wrap { display:flex; flex-wrap:wrap; gap:.5rem; padding-left:.875rem; }
.ingredient-pill {
    background:var(--lighter-blue); border:1px solid var(--light-blue);
    color:var(--dark-blue); padding:.3rem .75rem;
    border-radius:20px; font-size:.825rem;
}

/* NHI Section */
.nhi-section {
    background:var(--amber-bg); border:1.5px solid var(--amber-border);
    border-radius:12px; padding:1.125rem 1.25rem; margin-bottom:1.25rem;
}
.nhi-section .info-label { color:var(--amber-text); }
.nhi-section .info-label::before { background:var(--amber-border); }
.nhi-section .info-content { color:var(--amber-text); }
.nhi-meta { font-size:.78rem; color:var(--amber-text); opacity:.8; margin-top:.4rem; padding-left:.875rem; }

/* Image Section */
.image-section {
    background:var(--teal-bg); border:1.5px solid var(--teal-border);
    border-radius:12px; padding:1.125rem 1.25rem; margin-bottom:1.25rem;
}
.image-section .info-label { color:var(--teal-text); }
.image-section .info-label::before { background:var(--teal-border); }
.image-thumbs { display:flex; flex-wrap:wrap; gap:.5rem; padding-left:.875rem; margin-top:.5rem; }
.image-thumb-link {
    background:white; border:1px solid var(--teal-border); color:var(--teal-text);
    padding:.3rem .75rem; border-radius:8px; font-size:.825rem;
    text-decoration:none; transition:background .2s;
}
.image-thumb-link:hover { background:var(--teal-border); color:white; }

/* Links */
.links-row {
    display:flex; flex-wrap:wrap; gap:.625rem;
    padding-top:1.125rem; border-top:1px solid var(--border-color);
}
.link-btn {
    display:inline-flex; align-items:center; gap:.4rem;
    padding:.55rem 1.125rem; border-radius:8px; font-size:.875rem;
    font-weight:500; text-decoration:none; transition:all .2s ease;
    font-family:inherit; cursor:pointer;
    border:none;
}
button.link-btn { line-height:inherit; }
.link-btn-primary { background:var(--primary-blue); color:white; }
.link-btn-primary:hover { background:var(--dark-blue); transform:translateY(-1px); }
.link-btn-outline {
    background:var(--bg-white); color:var(--primary-blue);
    border:2px solid var(--primary-blue);
}
.link-btn-outline:hover { background:var(--lighter-blue); }
.link-btn-amber {
    background:var(--amber-bg); color:var(--amber-text); border:2px solid var(--amber-border);
}
.link-btn-amber:hover { background:var(--amber-border); color:white; }
.link-btn-gray {
    background:var(--gray-bg); color:var(--text-secondary); border:2px solid var(--gray-border);
}
.link-btn-gray:hover { background:var(--gray-border); color:white; }

.link-helper-tip {
    font-size:.78rem; color:var(--text-secondary);
    width:100%; padding-top:.4rem;
}

.error-msg {
    background:#fee2e2; border:1.5px solid #ef4444; color:#991b1b;
    padding:.875rem 1.125rem; border-radius:10px; margin-top:.75rem; display:none;
}
.error-msg.active { display:block; animation:fadeIn .3s ease-out; }

footer {
    text-align:center; padding:2rem 1rem; color:var(--text-secondary);
    font-size:.8rem; margin-top:2rem;
}
footer a { color:var(--primary-blue); text-decoration:none; }

@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* 劑型篩選列 */
.dosage-row {
    display:flex; flex-wrap:wrap; gap:.4rem;
    align-items:center; margin-top:.5rem;
}
.dosage-label {
    font-size:.825rem; color:var(--text-secondary); margin-right:.25rem;
}
.dosage-btn {
    padding:.3rem .7rem; border:1.5px solid var(--border-color);
    background:white; border-radius:16px; font-size:.78rem;
    cursor:pointer; font-family:inherit; transition:all .2s ease;
    color:var(--text-secondary);
}
.dosage-btn:hover { border-color:var(--secondary-blue); color:var(--primary-blue); }
.dosage-btn.active {
    background:var(--secondary-blue); color:white; border-color:var(--secondary-blue);
}

/* 關鍵字高亮 */
.hl {
    background:#fef08a; color:#713f12;
    border-radius:3px; padding:0 2px;
    font-weight:600;
}
@keyframes spin   { to{transform:rotate(360deg)} }

/* NHI 代號表格 */
.nhi-table-wrap {
    margin-top:.75rem;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    border-radius:8px;
}
.nhi-codes-table {
    width:100%; border-collapse:collapse;
    font-size:.85rem;
    border:1px solid var(--amber-border);
    border-radius:8px; overflow:hidden;
}
.nhi-codes-table thead th {
    background:rgba(245,158,11,.12); padding:.4rem .6rem;
    text-align:left; font-size:.78rem; color:var(--amber-text);
    border-bottom:1px solid var(--amber-border);
}
.nhi-codes-table tbody td {
    padding:.4rem .6rem;
    border-bottom:1px solid rgba(245,158,11,.15);
}
.nhi-codes-table tbody tr:last-child td { border-bottom:none; }
.nhi-codes-table tbody tr:hover { background:rgba(245,158,11,.06); }
.price-cell { font-weight:600; white-space:nowrap; }
.atc-badge {
    display:inline-block; background:rgba(37,99,235,.08);
    color:var(--dark-blue); border:1px solid var(--light-blue);
    border-radius:4px; padding:0 .4rem; font-size:.78rem;
    font-family:monospace; letter-spacing:.03em; white-space:nowrap;
}
.copy-mini {
    background:none; border:1px solid rgba(245,158,11,.3);
    border-radius:4px; padding:1px 4px; margin-left:4px;
    cursor:pointer; font-size:.75rem; vertical-align:middle;
    transition:all .2s;
}
.copy-mini:hover { background:var(--amber-border); border-color:var(--amber-border); }

/* Inline link in info content */
.inline-link {
    display:inline-flex; align-items:center; gap:.25rem;
    margin-left:.5rem; padding:.15rem .55rem;
    background:rgba(245,158,11,.15); color:var(--amber-text);
    border:1px solid var(--amber-border); border-radius:6px;
    text-decoration:none; font-size:.78rem; font-weight:600;
    transition:all .2s ease;
}
.inline-link:hover {
    background:var(--amber-border); color:white;
}

/* 章節折疊 */
.chapter-details {
    margin-top:.75rem; background:rgba(255,255,255,.5);
    border:1px solid var(--amber-border); border-radius:8px;
    padding:.5rem .75rem;
}
.chapter-details summary {
    cursor:pointer; font-size:.875rem; color:var(--amber-text);
    padding:.3rem 0; user-select:none;
}
.chapter-details summary:hover { opacity:.85; }
.chapter-details[open] summary { margin-bottom:.5rem; padding-bottom:.5rem; border-bottom:1px solid var(--amber-border); }
.chapter-content {
    font-family:inherit; font-size:.825rem; line-height:1.7;
    color:var(--amber-text); white-space:pre-wrap; word-wrap:break-word;
    max-height:400px; overflow-y:auto; margin:0;
    padding:.5rem 0;
}

@media (max-width:640px) {
    h1 { font-size:1.375rem; }
    .search-box { flex-direction:column; }
    #searchBtn { width:100%; }
    .drug-card { padding:1.25rem; }
}

/* PWA Banners */
.pwa-banner {
    display:none; padding:.6rem 1.25rem;
    font-size:.875rem; align-items:center;
    justify-content:center; gap:.875rem; flex-wrap:wrap;
}
#offlineBanner {
    background:#fef3c7; border-bottom:1px solid #f59e0b;
    color:#92400e;
}
#installBanner {
    background:var(--lighter-blue); border-bottom:1px solid var(--light-blue);
    color:var(--primary-blue);
}
#updateBanner {
    background:var(--green-bg); border-bottom:1px solid var(--green-border);
    color:var(--green-text);
}
.pwa-action-btn {
    padding:.35rem .875rem; border:none; border-radius:8px;
    font-size:.825rem; font-weight:600; cursor:pointer; font-family:inherit;
}
.pwa-install-btn { background:var(--primary-blue); color:white; }
.pwa-install-btn:hover { background:var(--dark-blue); }
.pwa-dismiss-btn {
    background:none; color:var(--text-secondary);
    font-size:1rem; padding:.2rem .5rem;
}
</style>
</head>
<body>

<!-- PWA：離線模式提示 -->
<div id="offlineBanner" class="pwa-banner" role="status">
    ⚠️ 離線模式 · 使用快取資料（可能非最新版本）
</div>

<!-- PWA：資料已更新提示（背景 revalidate 取得新版時顯示） -->
<div id="updateBanner" class="pwa-banner" role="status">
    <span>🔄 藥品資料已有新版本</span>
    <button class="pwa-action-btn pwa-install-btn" id="reloadBtn">重新整理套用</button>
    <button class="pwa-action-btn pwa-dismiss-btn" id="dismissUpdateBtn" aria-label="關閉">✕</button>
</div>

<!-- PWA：安裝提示 -->
<div id="installBanner" class="pwa-banner" role="complementary">
    <span>📲 可將本系統安裝至主畫面，支援離線查詢</span>
    <button class="pwa-action-btn pwa-install-btn" id="installBtn">安裝 App</button>
    <button class="pwa-action-btn pwa-dismiss-btn" id="dismissInstallBtn" aria-label="關閉">✕</button>
</div>

<header>
    <div class="header-content">
        <div>
            <h1>🏥 藥品資訊查詢系統</h1>
            <p class="header-subtitle">整合食藥署與健保署開放資料 · 適用醫院藥師臨床查詢</p>
        </div>
        <span class="data-badge" id="dataBadge">資料載入中...</span>
    </div>
</header>

<div class="container">

    <div class="search-section">
        <div class="search-box">
            <div class="search-input-wrap">
                <input type="text" id="searchInput"
                       placeholder="請輸入藥品中文品名或英文品名（例如：Norvasc、脈優）"
                       autocomplete="off" role="combobox" aria-expanded="false"
                       aria-autocomplete="list" aria-controls="suggestBox" disabled>
                <div class="suggest-box" id="suggestBox" role="listbox"></div>
            </div>
            <button id="searchBtn" disabled>🔍 搜尋</button>
        </div>

        <div class="filter-row">
            <span class="filter-label">🔎 搜尋範圍：</span>
            <button class="scope-btn filter-btn active" data-scope="name">品名</button>
            <button class="scope-btn filter-btn" data-scope="ingredient">成分</button>
            <button class="scope-btn filter-btn" data-scope="both">全部</button>
        </div>

        <div class="filter-row">
            <span class="filter-label">📋 篩選範圍：</span>
            <button class="filter-btn active" data-filter="nhi">健保品項</button>
            <button class="filter-btn" data-filter="all">全部藥品</button>
            <button class="filter-btn" data-filter="non-nhi">未納健保</button>
            <button class="filter-btn" data-filter="raw">含原料藥</button>
        </div>

        <div class="dosage-row" id="dosageRow" style="display:none;">
            <span class="dosage-label">💊 劑型：</span>
            <button class="dosage-btn active" data-dosage="all">全部</button>
        </div>
        <p class="search-hint">💡 預設以品名搜尋、僅顯示健保品項；成分請切換「搜尋範圍」。輸入 2 字以上會出現建議。搜尋結果最多 30 筆。</p>

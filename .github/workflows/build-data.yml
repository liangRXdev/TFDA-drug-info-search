name: Build Drug Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'       # 每週日 UTC 18:00 = 台灣週一 02:00
  push:
    # 限定 main：本 workflow 會 git push 資料 commit，若不限分支，
    # 任何功能分支推送 build_data.py 都會跑完整建置並把 20MB+ 的資料
    # commit 推回該分支，污染 PR 且浪費 runner 時間。
    branches:
      - main
    paths:
      - 'build_data.py'
      - 'nhi_payment_rules.pdf'  # PDF 更新時也重跑

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # Actions 一律 pin 到 commit SHA：本 job 具 contents:write，可直接改寫
      # 供臨床查詢的藥品資料庫。mutable tag（@v5）遭上游投毒即可竄改資料。
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Check PDF status
        run: |
          if [ -f nhi_payment_rules.pdf ]; then
            echo "✅ 找到健保給付規定 PDF（$(du -h nhi_payment_rules.pdf | cut -f1)）"
          else
            echo "⚠️  找不到 nhi_payment_rules.pdf，章節對照將跳過"
            echo "    請至健保署下載最新 PDF 命名為 nhi_payment_rules.pdf 放入 repo 根目錄"
            echo "    來源：https://www.nhi.gov.tw/ch/cp-13108-67ddf-2508-1.html"
          fi

      - name: Build drug database
        run: python build_data.py

      - name: Show output file info
        run: |
          ls -lh drugs_data.json
          python -c "
          import json, sys
          d = json.load(open('drugs_data.json', encoding='utf-8'))
          m = d['_meta']
          print(f'總筆數: {m[\"totalRecords\"]:,}')
          print(f'健保品項: {m[\"nhiRecords\"]:,}')
          print(f'章節對照: {m[\"chaptersTotal\"]:,}')
          if m['nhiRecords'] < 1000:
              print(f'::error::健保品項數量異常（{m[\"nhiRecords\"]}），不應 commit！請檢查 NHI API', file=sys.stderr)
              sys.exit(1)
          "

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 僅以 drugs_data.json 判定是否有變動。data_version.json 只含建置
          # 時間戳，每次必然改變；若納入判定，跳過機制將永遠無法生效。
          git add drugs_data.json
          if git diff --staged --quiet -- drugs_data.json; then
            echo "📋 資料無變動，跳過 commit（本次建置的時間戳一併捨棄）"
          else
            git add data_version.json
            git commit -m "data: 自動更新藥品資料庫 $(date +'%Y-%m-%d')"
            git push
            echo "✅ 已自動更新 drugs_data.json"
          fi
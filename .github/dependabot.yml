version: 2

updates:
  # GitHub Actions 已 pin 到 commit SHA，需由 Dependabot 自動更新，否則會腐化
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
